user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stdout info;

events {
  worker_connections 512;
}

http {
    include       mime.types;
    # mime.types has mp3/ogg/m4a but not flac
    types {
      audio/flac flac;
    }
    map $cache_status $bytes_saved {
      default 0;
      HIT $body_bytes_sent;
    }

    map $upstream_response_length $upstream_bytes {
      default $upstream_response_length;
      "" 0;
      "-" 0;
    }

    map $upstream_response_time $log_upstream_time {
      default $upstream_response_time;
      "" 0;
      "-" 0;
    }

    map $upstream_status $log_upstream_status {
      default $upstream_status;
      "" 0;
      "-" 0;
    }

    # Require the slash after the host so the upstream host can't be extended
    # (e.g. /archive.org.attacker.com/../archive.org/x).
    map $request_uri $archive_path {
      ~^/archive\.org(/.*)$ $1;
    }

    map $request_uri $phishin_path {
      ~^/phish\.in(/.*)$ $1;
    }

    # Reject raw paths that normalize to something different than they look:
    # dot segments, doubled slashes, encoded dots, slashes and backslashes.
    # Location matching and proxy_store use the normalized $uri while the
    # upstream request uses the raw $request_uri, so any difference allows
    # SSRF or cache poisoning.
    map $request_uri $unsafe_uri {
      default 0;
      "~^[^?]*(//|/\.\.?(/|\?|$)|%2[eEfF]|%5[cC])" 1;
    }

    # Only follow redirects back to the origin's own hosts.
    map $upstream_http_location $redirect_allowed {
      default 0;
      ~^https://([a-z0-9-]+\.)*archive\.org(:443)?/ 1;
      ~^https://([a-z0-9-]+\.)*phish\.in(:443)?/ 1;
    }

    # Only persist responses with a Content-Length under 500MB; anything larger
    # or without a length is still streamed to the client but not stored. An
    # empty proxy_store path makes nginx discard the temp file.
    # (proxy_max_temp_file_size doesn't apply when proxy_store is on.)
    map $upstream_http_content_length $store_path {
      default "";
      "~^([1-9]\d{0,7}|[1-4]\d{8})$" /data/nginx$uri;
    }

    map $http_origin $cors_origin {
      default "";
      ~^https://timber\.relisten\.net$ $http_origin;
      ~^https://relisten\.net$ $http_origin;
      ~^http://localhost:3000$ $http_origin;
    }

    log_format cache_stats_json escape=json '{ "remote_addr":"$remote_addr", "time_local":"$time_local", "method":"$request_method", "path":"$request_uri", "protocol":"$server_protocol", "status":$status, "body_bytes_sent":$body_bytes_sent, "cache_status":"$cache_status", "upstream_status":$log_upstream_status, "upstream_bytes":$upstream_bytes, "saved_bytes":$bytes_saved, "req_time":$request_time, "upstream_time":$log_upstream_time, "origin_host":"$origin_host", "range":"$http_range", "content_range":"$sent_http_content_range", "referer":"$http_referer", "ua":"$http_user_agent" }';

    access_log /dev/stdout cache_stats_json;

    default_type    application/octet-stream;
    sendfile        on;

    keepalive_timeout  65;

    #gzip  on;

    # proxy_cache_path  /data/nginx/cache  levels=1:2    keys_zone=STATIC:10m inactive=365d  max_size=256g use_temp_path=off;

    server {
        root /data/nginx/;
        listen       80;
        server_name  localhost;

        # Default cache status so non-proxied/health routes don't warn
        set $cache_status $upstream_cache_status;
        # Track original request path for proxy_store
        set $original_uri $request_uri;
        # Default origin host to incoming host unless overwritten in a location
        set $origin_host $host;

        sendfile           on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay       on;
        keepalive_timeout 65;
        autoindex off;
        etag on;

        resolver 1.1.1.1;


        # remove upstream headers we replace ourselves
        proxy_hide_header Set-Cookie;
        proxy_hide_header CF-Cache-Status;
        proxy_hide_header Expect-CT;
        proxy_hide_header CF-RAY;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;


        # add header to understand caching behavior
        add_header X-Relisten-Audio-Cache $upstream_cache_status;

        if ($unsafe_uri) {
            return 400;
        }

        # Route OPTIONS requests to the preflight handler
        error_page 469 = @cors_preflight;
        if ($request_method = 'OPTIONS') {
            return 469;
        }

        location @cors_preflight {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Vary' 'Origin' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        location ~* \.mp3$ {
            include cors.conf;

            # Add rewrite rules to handle these requests here
            add_header Cache-Control "public";
            default_type audio/mpeg;
            expires max;
        }

        location ~* \.json$ {
            include cors.conf;

            default_type application/json;
        }

        # Only audio downloads are proxied; everything else on archive.org is not.
        location ^~ /archive.org/download/ {
            include cors.conf;

            if ($uri !~* "\.(mp3|flac|ogg|m4a)$") {
                return 404;
            }

            set $cache_status HIT;
            set $origin_host archive.org;

            set $original_uri $request_uri;

            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # If the file exists, serve it; otherwise, proxy to archive.org.
            try_files $uri @fetch_archive;
        }

        location ^~ /archive.org/ {
            return 404;
        }

        location ^~ /phish.in/ {
            include cors.conf;

            if ($uri !~* "\.(mp3|flac|ogg|m4a)$") {
                return 404;
            }

            set $cache_status HIT;
            set $origin_host phish.in;

            set $original_uri $request_uri;

            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # If the file exists, serve it; otherwise, proxy to archive.org.
            try_files $uri @fetch_phishin;
        }

        location @fetch_archive {
            include cors.conf;

            set $cache_status MISS;
            set $origin_host archive.org;

            proxy_set_header Host archive.org;
            proxy_pass https://archive.org$archive_path;

            include proxy.conf;

            # Intercept redirect responses.
            proxy_intercept_errors on;
            recursive_error_pages on;
            error_page 301 302 303 307 308 = @handle_redirect;
        }

        location @fetch_phishin {
            include cors.conf;

            set $cache_status MISS;
            set $origin_host phish.in;

            proxy_set_header Host phish.in;
            proxy_pass https://phish.in$phishin_path;

            include proxy.conf;

            # Intercept redirect responses.
            proxy_intercept_errors on;
            recursive_error_pages on;
            error_page 301 302 303 307 308 = @handle_redirect;
        }

        # This location handles intercepted redirects.
        location @handle_redirect {
            include cors.conf;
            include proxy.conf;

            set $cache_status MISS;

            if ($redirect_allowed = 0) {
                return 502;
            }

            set $saved_redirect_location $upstream_http_location;
            proxy_pass $saved_redirect_location;
        }

        # return 200 'location 3';
    }
}
